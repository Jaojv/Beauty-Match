spring.application.name=MatchBeauty

# Configurações do Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3307/beautymatch?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configurações do BCrypt
spring.security.crypto.bcrypt.BCryptPasswordEncoder=10

# Configurações do SQL (trocar para always se der bug de inicialização)
spring.sql.init.mode=never 
spring.jpa.defer-datasource-initialization=true

# Configurações do JWT
app.jwt.expiration=3600000

# Configuração do CORS
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Configurações para resolver problemas de Content-Type
spring.mvc.contentnegotiation.default-content-type=application/json
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.favor-path-extension=false

# Configurações de servidor
server.port=8080
server.servlet.context-path=/

# Configurações para arquivos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Configurações de logging para debug
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.beauty=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
debug=true
