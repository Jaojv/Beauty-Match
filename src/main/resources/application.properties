spring.application.name=MatchBeauty

# Configurações do Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3307/beautymatch?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configurações do BCrypt
spring.security.crypto.bcrypt.BCryptPasswordEncoder=10

# Configurações do SQL (trocar para always se der bug de inicialização)
spring.sql.init.mode=never 
spring.jpa.defer-datasource-initialization=true

# Configurações do JWT
app.jwt.expiration=3600000

# Configuração do CORS
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Ativa logs detalhados do Spring Boot
logging.level.org.springframework=DEBUG
logging.level.com.beauty=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
debug=true
