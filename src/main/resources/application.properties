# Configuração do Banco de Dados MySQL
# URL de conexão com o banco de dados, incluindo criação automática se não existir
spring.datasource.url=jdbc:mysql://localhost:3307/beauty?createDatabaseIfNotExist=true
# Credenciais de acesso ao banco de dados
spring.datasource.username=root
spring.datasource.password=root
# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do JPA (Java Persistence API)
# update: Atualiza o esquema do banco automaticamente baseado nas entidades
spring.jpa.hibernate.ddl-auto=update
# Mostra as queries SQL no console
spring.jpa.show-sql=true
# Formata as queries SQL para melhor legibilidade
spring.jpa.properties.hibernate.format_sql=true
# Dialeto SQL específico para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuração de inicialização do banco de dados
# Garante que o SQL seja executado após a criação das tabelas
spring.jpa.defer-datasource-initialization=true
# Sempre executa os scripts SQL de inicialização
spring.sql.init.mode=always 