<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Match - Login</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/darkmode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!--NAVBAR-->
    <nav>
        <a href="../index.html" class="home-icon"><img src="../images/home.png"></a>
            <div class="button-container" id="button-index">
                <a class="botao" id="darkmode-botao" href=""><div class="darkmode"><img src="../images/dark.png"></div></a>
                <a class="botao" href="cadastrar.html">Cadastrar-se</a>
                <a class="botao" href="login.html">Login</a>
            </div>
    </nav>

    <!--MAIN-->
    <main>
        <div class="container">
            <div class="main-container">
                <h1 class="title" id="Login">Login</h1>
                <form id="loginForm">
                <div class="input-container">
                    <input type="text" name="usuario" id="username" placeholder="Usuario" required>
                </div>
                <div class="input-container">
                    <input type="password" name="senha" id="password" placeholder="Senha" required>
                </div>
                <div class="button-container">
                    <button class="botao" id="loginButton" type="submit">
                        <span id="loginText">Entrar</span>
                        <span id="loadingText" style="display: none;">Entrando...</span>
                    </button>
                </div>
                </form>
            </div>
        </div>
    </main>

    <!--FOOTER-->
    <footer></footer>

    <!--SCRIPT JS-->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/darkmode.js"></script>
    <script>
        // Script específico para login
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const loginText = document.getElementById('loginText');
            const loadingText = document.getElementById('loadingText');

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Obter valores dos campos
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                // Validação básica
                if (!username || !password) {
                    alert('Por favor, preencha todos os campos');
                    return;
                }

                // Mostrar loading
                setLoading(true);

                try {
                    // Fazer login
                    const response = await apiClient.login(username, password);
                    
                    // Salvar dados de autenticação
                    window.authManager.saveAuthData(response.token, {
                        id: response.idUsuario,
                        username: response.username,
                        nome: response.nome,
                        email: response.email,
                        tipoUsuario: response.tipoUsuario
                    });

                    alert('Login realizado com sucesso!');
                    
                    // Redirecionar para página inicial
                    window.location.href = '../index.html';
                    
                } catch (error) {
                    console.error('Erro no login:', error);
                    alert('Erro no login: ' + error.message);
                } finally {
                    setLoading(false);
                }
            });

            function setLoading(loading) {
                if (loading) {
                    loginButton.disabled = true;
                    loginText.style.display = 'none';
                    loadingText.style.display = 'inline';
                } else {
                    loginButton.disabled = false;
                    loginText.style.display = 'inline';
                    loadingText.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
