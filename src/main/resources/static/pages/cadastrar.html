<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Match - Cadastro</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/darkmode.css">
    <link rel="stylesheet" href="../css/responsividade.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!--NAVBAR-->
    <nav>
        <a href="../index.html" class="home-icon"><img src="../images/home.png"></a>
            <div class="button-container" id="button-index">
                <!-- Perfil do usuário (visível apenas quando logado) -->
                <div class="perfil" id="perfil-usuario" style="display: none;">
                    <a class="botao_logado" href="">
                        <input type="text" id="username-display" value="" readonly>
                        <img class="perfil-img" src="../images/user.png" alt="Perfil">
                    </a>
                    <!-- Modal de perfil do usuário -->
                    <div id="modal-perfil" class="modal-perfil" style="display: none;">
                        <div class="modal-conteudo">
                            <span class="fechar-modal" id="fechar-modal">&times;</span>
                            <div class="titulo-modal">
                                <img src="../images/usuario.png">
                                <h2>Perfil</h2>
                            </div>
                            <div class="img-modal">
                                <img class="perfil-img" id="foto-perfil" src="../images/user.png" alt="Perfil" style="cursor: pointer;">
                                <!-- Container para upload de imagem (visível apenas em modo de edição) -->
                                <div id="container-imagem-perfil" style="display: none; margin-top: 10px;">
                                    <input type="file" id="input-imagem-perfil" accept="image/*" style="display: none;">
                                </div>
                            </div>
                            <div class="dados-modal">
                                <table>
                                <tr>
                                    <td class="label">Nome:</td>
                                    <td><input type="text" id="nome-perfil" value="" readonly></td>
                                </tr>
                                <tr>
                                    <td class="label">Email:</td>
                                    <td><input type="email" id="email-perfil" value="" readonly></td>
                                </tr>
                                <tr>
                                    <td class="label">Senha:</td>
                                    <td><input type="password" id="senha-perfil" value="" readonly></td>
                                </tr>
                                </table>
                            </div>
                            <button id="editar-perfil">Editar Perfil</button>
                        </div>
                    </div>
                </div>
                <!-- Botões de login/cadastro (visíveis apenas quando não logado) -->
                <a class="botao" id="cadastrar-link" href="cadastrar.html">Cadastrar-se</a>
                <a class="botao" id="login-link" href="login.html">Login</a>
            </div>
    </nav>

    <!--MAIN-->
    <main>
        <div class="container">
            <div class="main-container">
                <h1 class="title" id="Cadastro">Cadastro</h1>
                <form id="registerForm">
                <div class="input-container">
                    <input type="text" name="usuario" id="username" placeholder="Usuario" required>
                </div>
                <div class="input-container">
                    <input type="password" name="senha" id="password" placeholder="Senha" required>
                </div>
                <div class="input-container">
                    <input type="text" name="nome" id="nome" placeholder="Nome" required>
                </div>
                <div class="input-container">
                    <input type="email" name="email" id="email" placeholder="Email" required>
                </div>
                <div class="button-container">
                    <button class="botao" id="registerButton" type="submit">
                        <span id="registerText">Cadastrar-se</span>
                        <span id="loadingText" style="display: none;">Cadastrando...</span>
                    </button>
                </div>
                </form>
            </div>
        </div>
    </main>

    <!--FOOTER-->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <p>&copy; 2025 Beauty Match. Todos os direitos reservados.</p>
            </div>
            <div class="footer-section">
                <p>Desenvolvido por: Equipe Beauty Match</p>
            </div>
            <div class="footer-section">
                <p>Versão 1.0.0 | TCC - Tecnologia em Desenvolvimento de Sistemas</p>
            </div>
            <div class="footer-section">
                <p>Política de Privacidade | Termos de Uso | Suporte</p>
            </div>
        </div>
    </footer>

    <!--SCRIPT JS-->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/darkmode.js"></script>
    <script src="../js/perfil_usuario.js"></script>
    <script>
        // Script específico para cadastro
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const registerButton = document.getElementById('registerButton');
            const registerText = document.getElementById('registerText');
            const loadingText = document.getElementById('loadingText');

            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Obter valores dos campos
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const nome = document.getElementById('nome').value.trim();
                const email = document.getElementById('email').value.trim();

                // Validação básica
                if (!username || !password || !nome || !email) {
                    alert('Por favor, preencha todos os campos');
                    return;
                }

                // Validação de email
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    alert('Por favor, insira um email válido');
                    return;
                }

                // Validação de senha
                if (password.length < 6) {
                    alert('A senha deve ter pelo menos 6 caracteres');
                    return;
                }

                // Mostrar loading
                setLoading(true);

                try {
                    // Fazer cadastro
                    const response = await apiClient.register(username, password, nome, email);
                    
                    alert('Cadastro realizado com sucesso! Faça login para continuar.');
                    
                    // Redirecionar para página de login
                    window.location.href = 'login.html';
                    
                } catch (error) {
                    console.error('Erro no cadastro:', error);
                    alert('Erro no cadastro: ' + error.message);
                } finally {
                    setLoading(false);
                }
            });

            function setLoading(loading) {
                if (loading) {
                    registerButton.disabled = true;
                    registerText.style.display = 'none';
                    loadingText.style.display = 'inline';
                } else {
                    registerButton.disabled = false;
                    registerText.style.display = 'inline';
                    loadingText.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
