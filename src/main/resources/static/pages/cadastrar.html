<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Match - Cadastro</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/darkmode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!--NAVBAR-->
    <nav>
        <a href="../index.html" class="home-icon"><img src="../images/home.png"></a>
            <div class="button-container" id="button-index">
                <a class="botao" id="darkmode-botao" href=""><div class="darkmode"><img src="../images/dark.png"></div></a>
                <a class="botao" href="cadastrar.html">Cadastrar-se</a>
                <a class="botao" href="login.html">Login</a>
            </div>
    </nav>

    <!--MAIN-->
    <main>
        <div class="container">
            <div class="main-container">
                <h1 class="title" id="Cadastro">Cadastro</h1>
                
                <!-- Mensagem de erro/sucesso -->
                <div id="message" class="message" style="display: none;"></div>
                
                <form id="cadastroForm">
                    <div class="input-container">
                        <input type="text" name="username" id="username" placeholder="Usuário" required>
                    </div>
                    <div class="input-container">
                        <input type="password" name="password" id="password" placeholder="Senha" required>
                    </div>
                    <div class="input-container">
                        <input type="text" name="nome" id="nome" placeholder="Nome" required>
                    </div>
                    <div class="input-container">
                        <input type="email" name="email" id="email" placeholder="Email" required>
                    </div>
                    <div class="button-container">
                        <button class="botao" type="submit" id="cadastroButton">
                            <span id="cadastroText">Cadastrar-se</span>
                            <span id="loadingText" style="display: none;">Cadastrando...</span>
                        </button>
                    </div>
                </form>
                
                <div class="button-container">
                    <a class="botao" href="login.html">Já tem conta? Faça login</a>
                </div>
            </div>
        </div>
    </main>

    <!--FOOTER-->
    <footer></footer>

    <!--SCRIPT JS-->
    <script src="../js/auth.js"></script>
    <script src="../js/test-api.js"></script>
    <script src="../js/darkmode.js"></script>
    <script>
        // Verificar se já está logado
        if (authService.isAuthenticated()) {
            redirectBasedOnUserType();
        }

        // Manipular formulário de cadastro
        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cadastroButton = document.getElementById('cadastroButton');
            const cadastroText = document.getElementById('cadastroText');
            const loadingText = document.getElementById('loadingText');
            const messageDiv = document.getElementById('message');
            
            // Mostrar loading
            cadastroButton.disabled = true;
            cadastroText.style.display = 'none';
            loadingText.style.display = 'inline';
            messageDiv.style.display = 'none';
            
            try {
                // Dados para registro (apenas CLIENTE por enquanto)
                const registroData = {
                    username: username,
                    password: password,
                    nome: nome,
                    email: email,
                    tipoUsuario: 'CLIENTE' // Fixo como CLIENTE
                };
                
                await authService.register(registroData);
                
                // Cadastro bem-sucedido
                showMessage('Cadastro realizado com sucesso! Redirecionando...', 'success');
                
                // Redirecionar após um breve delay
                setTimeout(() => {
                    redirectBasedOnUserType();
                }, 2000);
                
            } catch (error) {
                // Cadastro falhou
                let errorMessage = 'Erro no cadastro. Tente novamente.';
                
                if (error.message.includes('Username')) {
                    errorMessage = 'Nome de usuário já existe. Tente outro.';
                } else if (error.message.includes('Email')) {
                    errorMessage = 'Email já está em uso. Tente outro.';
                } else if (error.message.includes('Credenciais')) {
                    errorMessage = 'Dados inválidos. Verifique as informações.';
                }
                
                showMessage(errorMessage, 'error');
                
                // Reativar botão
                cadastroButton.disabled = false;
                cadastroText.style.display = 'inline';
                loadingText.style.display = 'none';
            }
        });
        
        // Função para mostrar mensagens
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Auto-hide após 5 segundos
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
    
    <style>
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .botao:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</body>
</html>
